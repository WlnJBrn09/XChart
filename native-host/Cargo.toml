[package]
name = "xchart-native"
version = "0.1.0"
edition = "2021"
description = "XChart — native system WebView host with local Rust backend"
license = "MIT"
authors = ["XChart"]

[[bin]]
name = "xchart-native"
path = "src/main.rs"

[dependencies]
anyhow = "1"
rand = "0.8"
dirs = "6"
image = { version = "0.25", default-features = false, features = ["png"] }
tao = "0.32"
wry = "0.50"

[build-dependencies]
winres = "0.1"

[dev-dependencies]
tempfile = "3"
