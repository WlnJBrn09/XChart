<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><meta name="description" content="XChart — local chart editor"/><meta name="theme-color" content="#ffffff"/><title>Untitled chart — XChart</title><script>try{document.documentElement.dataset.theme=localStorage.getItem('xchart-theme')||((matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light')}catch(e){document.documentElement.dataset.theme='light'}</script><link rel="icon" href="assets/logo.svg" type="image/svg+xml"/><link rel="stylesheet" href="style.css"/><link rel="stylesheet" href="editor.css"/></head>
<body data-product="XChart" data-slug="xchart" data-kind="chart"><input type="file" id="file-input" class="sr-only" accept=".csv,.tsv,.json"/>
<div id="app"><aside id="sidebar" class="liquid-glass" aria-label="Library"><div class="sidebar-brand"><img class="sidebar-logo" src="assets/logo.svg" alt=""/><div><div class="brand-name">XChart</div><div class="brand-sub">Charts</div></div></div><div class="sidebar-actions"><button class="sidebar-btn pressable" id="new-btn"><span class="material-symbols-outlined" aria-hidden="true">bar_chart</span> New Chart</button><button class="sidebar-btn pressable" id="open-btn"><span class="material-symbols-outlined" aria-hidden="true">folder_open</span> Open File</button></div><div class="tabs-head"><span>Library</span><button class="icon-btn" id="refresh-btn" aria-label="Refresh library" title="Refresh library"><span class="material-symbols-outlined" aria-hidden="true">refresh</span></button></div><div class="file-hint">CSV · TSV · JSON</div><div id="doc-list" class="doc-list" role="list"></div></aside>
<div id="main-col"><header id="header" class="liquid-glass"><div class="header-top"><div class="header-left"><img class="app-logo" src="assets/logo.svg" alt="XChart"/><div class="title-row"><div id="doc-title" class="doc-title" contenteditable="true" role="textbox" spellcheck="false" aria-label="Document title">Untitled chart</div><button id="star-btn" class="icon-btn pressable" aria-label="Star document" title="Star" aria-pressed="false"><span class="material-symbols-outlined" aria-hidden="true">star</span></button><span id="status" class="status-pill" aria-live="polite">Ready</span></div></div><div class="header-actions"><button id="theme-btn" class="glass-btn pressable" aria-label="Toggle theme" title="Toggle theme"><span class="material-symbols-outlined" aria-hidden="true">dark_mode</span></button><button id="print-btn" class="glass-btn pressable" title="Print or save PDF"><span class="material-symbols-outlined" aria-hidden="true">print</span> Print</button><button id="save-btn" class="glass-btn pressable" title="Save (Ctrl+S)"><span class="material-symbols-outlined" aria-hidden="true">save</span> Save</button><label class="sr-only" for="export-format">Export format</label><select id="export-format" class="glass-btn" aria-label="Export format"><option value="svg">SVG image (.svg)</option><option value="png">PNG image (.png)</option><option value="csv">Data (.csv)</option><option value="json">Editable JSON (.json)</option></select><button id="export-btn" class="glass-btn primary pressable">Export</button></div></div><div class="toolbar-area"><div class="toolbar-pill liquid-glass liquid-glass--light" role="toolbar" aria-label="Editing tools"><button class="tool-btn pressable" data-chart-type="bar">Bar</button><button class="tool-btn pressable" data-chart-type="line">Line</button><button class="tool-btn pressable" data-chart-type="area">Area</button><button class="tool-btn pressable" data-chart-type="pie">Pie</button><button class="tool-btn pressable" data-chart-type="scatter">Scatter</button><span class="v-sep"></span><button class="tool-btn pressable" id="undo-btn" title="Undo">↶ Undo</button><button class="tool-btn pressable" id="redo-btn" title="Redo">↷ Redo</button></div></div></header>
<div id="workspace"><aside class="inspector" aria-label="Editor options"><h2>Chart settings</h2><label for="chart-title">Chart title</label><input class="field" id="chart-title"/><label for="x-title">Horizontal axis</label><input class="field" id="x-title"/><label for="y-title">Vertical axis</label><input class="field" id="y-title"/><label class="check-row"><input type="checkbox" id="show-legend"/> Show legend</label><label class="check-row"><input type="checkbox" id="show-grid"/> Show grid</label><h3>Data</h3><p class="subtle">Edit the table, or open a CSV or TSV file.</p><div class="row"><button class="small-btn" id="add-row">Add row</button><button class="small-btn" id="add-series">Add series</button></div><div id="data-grid"></div></aside><div class="stage"><div class="chart-stage"><div id="chart-preview" class="paper" aria-label="Chart preview"></div><p class="stage-caption">Edit values on the left. Export SVG or PNG to share the chart.</p></div></div></div></div></div><div class="toast hidden" id="toast" role="status"></div><script src="model.js"></script><script src="editor.js"></script><script src="shell.js"></script></body></html>
